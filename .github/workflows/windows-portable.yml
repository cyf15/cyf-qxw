name: Windows portable game

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pvp-game/pom.xml
      - name: Build, test and package
        shell: pwsh
        run: ./pvp-game/scripts/package-windows.ps1
      - name: Publish portable download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem pvp-game/output/portable-*/SpireDuel-Windows-x64.zip | Select-Object -First 1
          if (-not $zip) { throw 'Portable ZIP missing' }
          $projectZip = Get-ChildItem pvp-game/output/portable-*/aut-lab-Windows-x64.zip | Select-Object -First 1
          if (-not $projectZip) { throw 'Complete project ZIP missing' }
          $tag = 'windows-portable-' + $env:GITHUB_SHA.Substring(0, 7)
          $notes = @"
          Windows 10/11 x64 portable edition. Extract the whole SpireDuel-Windows-x64.zip, then double-click SpireDuel.exe.
          For the complete aut lab folder including source, reference assets and the ready-to-run EXE, download aut-lab-Windows-x64.zip. Extract and open aut lab/SpireDuel.exe.
          SpireDuel.exe, app/ and runtime/ are directly at the extraction root. Extract into aut lab to launch aut lab/SpireDuel.exe.
          Java, dependencies and assets are included. No installation or network is needed to play.
          Save files: data/. Keep this folder when updating.
          Build and unit tests ran on GitHub Actions. Requires an OpenGL graphics driver.
          SHA256: $((Get-FileHash $zip.FullName -Algorithm SHA256).Hash)
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'portable-release.txt'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          gh release create $tag $zip.FullName $projectZip.FullName --target $env:GITHUB_SHA --title '修改.exe位置 - aut lab 完整交付' --notes-file $notesPath --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
